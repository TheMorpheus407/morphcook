<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MorphCook — Warm Paper Cookbook Prototype</title>
  <style>
    :root {
      --paper-bg: #FAF6F0;
      --card-cream: #F3ECE1;
      --warm-sand: #E6DCCD;
      --ink-primary: #2B2520;
      --ink-secondary: #5C5248;
      --ink-muted: #8C7F70;
      --terracotta: #C85A32;
      --sage: #6B7F5E;
      --ochre: #D49B35;
      --rule: #DCD0C0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper-bg);
      color: var(--ink-primary);
      font-family: Georgia, "Playfair Display", serif;
      line-height: 1.55;
      padding: 2rem 1rem 4rem;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card-cream);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(43, 37, 32, 0.06);
    }
    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--terracotta);
    }
    h1 {
      margin: 0.35rem 0;
      font-size: 2.1rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--ink-secondary);
      font-style: italic;
      margin-bottom: 1.5rem;
    }
    .dashed-rule {
      border-bottom: 1px dashed var(--rule);
      margin: 1.5rem 0;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
    }
    .control-group label {
      display: block;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.4rem;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    button.pill {
      background: var(--paper-bg);
      border: 1px solid var(--rule);
      color: var(--ink-primary);
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      cursor: pointer;
    }
    button.pill.active {
      background: var(--terracotta);
      color: #fff;
      border-color: var(--terracotta);
    }
    .meta-bar {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      background: var(--paper-bg);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--rule);
    }
    .grid-two {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 1.75rem;
    }
    @media (max-width: 680px) {
      .grid-two { grid-template-columns: 1fr; }
    }
    ul.ingredients {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    ul.ingredients li {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px dotted var(--rule);
      font-size: 0.95rem;
    }
    .mono {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      color: var(--ink-secondary);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">MorphCook · Offline Adaptive Cookbook Reference</div>
    <h1 id="dish-title">Golden Saffron &amp; Herb Risotto</h1>
    <div class="subtitle" id="variant-subtitle">Creamy arborio rice infused with warm saffron threads</div>

    <div class="controls">
      <div class="control-group">
        <label>Diet Dimension</label>
        <div class="pills" id="diet-pills">
          <button class="pill active" onclick="setDim('diet','vegetarian')">Vegetarian</button>
          <button class="pill" onclick="setDim('diet','vegan')">Vegan</button>
          <button class="pill" onclick="setDim('diet','keto')">Keto</button>
        </div>
      </div>
      <div class="control-group">
        <label>Effort Dimension</label>
        <div class="pills" id="effort-pills">
          <button class="pill" onclick="setDim('effort','quick')">Quick (20m)</button>
          <button class="pill active" onclick="setDim('effort','classic')">Classic (35m)</button>
        </div>
      </div>
      <div class="control-group">
        <label>Calorie Tier</label>
        <div class="pills" id="calorie-pills">
          <button class="pill" onclick="setDim('calorie','light')">Light</button>
          <button class="pill active" onclick="setDim('calorie','balanced')">Balanced</button>
          <button class="pill" onclick="setDim('calorie','hearty')">Hearty</button>
        </div>
      </div>
    </div>

    <div class="dashed-rule"></div>

    <div class="meta-bar" id="meta-bar">
      <span>VARIANT: <strong id="v-code">vegetarian · classic · balanced</strong></span>
      <span>PREP+COOK: <strong id="v-time">35 min</strong></span>
      <span>MACROS: <strong id="v-kcal">520 kcal</strong></span>
    </div>

    <div class="dashed-rule"></div>

    <div class="grid-two">
      <section>
        <h3>Ingredients</h3>
        <ul class="ingredients" id="ingredient-list"></ul>
      </section>
      <section>
        <h3>Method</h3>
        <ol id="step-list"></ol>
      </section>
    </div>
  </main>

  <script>
    const state = { diet: 'vegetarian', effort: 'classic', calorie: 'balanced' };
    function setDim(axis, val) {
      state[axis] = val;
      document.querySelectorAll(`#${axis}-pills .pill`).forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().startsWith(val));
      });
      render();
    }
    function render() {
      document.getElementById('v-code').textContent = `${state.diet} · ${state.effort} · ${state.calorie}`;
      document.getElementById('v-time').textContent = state.effort === 'quick' ? '20 min' : '35 min';
      const kcal = state.calorie === 'light' ? '390 kcal' : state.calorie === 'hearty' ? '670 kcal' : '520 kcal';
      document.getElementById('v-kcal').textContent = kcal;
      const base = state.diet === 'keto' ? ['Cauliflower rice', '350 g'] : ['Arborio rice', '240 g'];
      const dairy = state.diet === 'vegan'
        ? [['Cashew cream', '45 ml'], ['Nutritional yeast', '2 tbsp']]
        : [['Aged Parmigiano', '40 g'], ['Cultured butter', '25 g']];
      const ings = [base, ['Warm vegetable stock', '750 ml'], ['Saffron threads', '0.5 g'], ...dairy];
      document.getElementById('ingredient-list').innerHTML = ings
        .map(([n, q]) => `<li><span>${n}</span><span class="mono">${q}</span></li>`)
        .join('');
      const steps = [
        'Steep saffron threads in warm aromatic stock for 5 minutes.',
        state.diet === 'keto'
          ? 'Sauté shallots and pulse-riced cauliflower in olive oil until tender-crisp.'
          : 'Toast arborio rice gently with shallots until edges turn translucent.',
        'Fold in saffron infusion and finish off-heat for a glossy emulsion.'
      ];
      document.getElementById('step-list').innerHTML = steps.map(s => `<li style="margin-bottom:0.65rem">${s}</li>`).join('');
    }
    render();
  </script>
</body>
</html>
