name: morphcook
description: A complete little cookbook for every way of eating.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  cross_file: ^0.3.5
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.3
  google_fonts: ^8.0.0
  hive: ^2.2.3
  intl: any
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
