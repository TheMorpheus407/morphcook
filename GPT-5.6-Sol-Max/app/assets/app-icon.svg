<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="stripes" width="112" height="112" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="48" height="112" fill="#D66B5C"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="1978" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feComponentTransfer in="grey" result="faded">
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <style>
      @font-face { font-family: "PlayfairLocal"; src: url("fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf"); font-style: italic; }
      @font-face { font-family: "MonoLocal"; src: url("fonts/JetBrainsMono-VariableFont_wght.ttf"); }
    </style>
  </defs>
  <rect width="1024" height="1024" fill="#F3ECDD"/>
  <rect width="1024" height="1024" fill="url(#stripes)" filter="url(#grain)"/>
  <g transform="rotate(-2.5 512 512)">
    <rect x="142" y="255" width="740" height="514" fill="#F8F2E6" stroke="#282521" stroke-width="18"/>
    <line x1="188" y1="680" x2="836" y2="680" stroke="#282521" stroke-width="8" stroke-dasharray="28 20"/>
    <text x="512" y="614" text-anchor="middle" fill="#282521" font-family="PlayfairLocal, Georgia, serif" font-style="italic" font-weight="700" font-size="430">M</text>
    <text x="512" y="730" text-anchor="middle" fill="#D66B5C" font-family="MonoLocal, monospace" font-weight="700" font-size="48" letter-spacing="12">MORPHCOOK</text>
  </g>
</svg>
