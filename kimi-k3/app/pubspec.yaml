name: morphcook
description: "MorphCook — one cookbook for every body. Offline-first recipe app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_animate: ^4.5.0
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  archive: ^3.6.1
  pointycastle: ^3.9.1
  intl: ^0.20.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/partition-manifest.json
    - assets/data/core-recipes.json
    - assets/data/extended-recipes.json
    - assets/data/cuisine-italian.json
    - assets/data/cuisine-asian.json
    - assets/data/cuisine-middle-eastern.json
    - assets/data/dishes.json
    - assets/data/ontology.json
    - assets/data/ingredients.json
    - assets/data/ingredient-guide.json
    - assets/data/faqs.json
    - assets/data/search-index.json

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700
